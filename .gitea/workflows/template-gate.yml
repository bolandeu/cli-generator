name: template-gate

# The template gate (scripts/check_template.sh) on homeserver: renders every variant of the
# template and runs their checks. The Mac runs the same script by hand.
# push has no branch filter: antagor publish pushes antagor/publish-<commit> and reads the status.
on:
  push:
  workflow_dispatch:

jobs:
  gate:
    runs-on: docker
    timeout-minutes: 60
    container:
      image: node:22-bookworm
      options: --init
      volumes:
        - ci-cache:/cache
    env:
      UV_CACHE_DIR: /cache/uv
      XDG_CACHE_HOME: /cache/xdg
      UV_PYTHON_INSTALL_DIR: /cache/python
      UV_LINK_MODE: copy
      UV_PYTHON: "3.14"
      UV_TOOL_BIN_DIR: /cache/bin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: the update rounds start from release tags
      - name: uv
        run: |
          mkdir -p /cache/bin
          [ -x /cache/bin/uv ] || curl -LsSf --max-time 300 https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/cache/bin UV_NO_MODIFY_PATH=1 sh
          echo /cache/bin >> "$GITHUB_PATH"
      - name: osv-scanner and gitleaks
        run: |
          mkdir -p /cache/bin
          osv=/cache/bin/osv-scanner-2.7.0
          [ -x $osv ] || { curl -LsSf --max-time 300 -o $osv https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 && chmod +x $osv; }
          gitleaks=/cache/bin/gitleaks-8.30.1
          [ -x $gitleaks ] || { curl -LsSf --max-time 300 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xzO gitleaks > $gitleaks && chmod +x $gitleaks; }
          ln -sf $osv /usr/local/bin/osv-scanner
          ln -sf $gitleaks /usr/local/bin/gitleaks
      # The gate runs antagor's layout check on each generated project.
      - name: antagor
        run: |
          uv tool install --force "antagor @ git+https://homeserver.tailee01ab.ts.net:3000/bolandeu/antagor.git@4fd5ab553fc9aae6083bc204eac6ffbd6da825c6"
      - name: Template gate
        run: sh scripts/check_template.sh
