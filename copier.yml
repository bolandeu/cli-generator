_subdirectory: template

# Project-owned after generation: `copier update` must not merge template
# prose into a README the project has rewritten.
_skip_if_exists:
  - "README.md"

_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if not include_auth %}src/{{ package_name }}/commands/login.py{% endif %}"
  - "{% if not include_auth %}src/{{ package_name }}/credentials{% endif %}"
  - "{% if not include_auth %}tests/test_auth.py{% endif %}"
  - "{% if not include_providers %}src/{{ package_name }}/providers{% endif %}"
  - "{% if not include_providers %}tests/test_providers.py{% endif %}"
  - "{% if not (include_providers and include_http_provider) %}src/{{ package_name }}/providers/http.py{% endif %}"
  - "{% if not (include_providers and include_http_provider) %}tests/test_http_provider.py{% endif %}"
  - "{% if not include_ci %}.github/workflows{% endif %}"

# The --help snapshots (tests/snapshots/help/) contain the CLI's name and wrap
# around it, so they're rendered in the generated project, not shipped.
_tasks:
  - command: "uv run --quiet pytest --snapshot-update --no-cov -q -p no:cacheprovider tests/test_help.py"
    when: "{{ _copier_operation == 'copy' }}"

package_name:
  type: str
  help: "Python import package (snake_case). Standard §10 for new tools: rb_<slug>, e.g. rb_serp"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    package_name must be a valid snake_case Python identifier
    {% endif %}

cli_name:
  type: str
  help: "Command users type (the [project.scripts] name), if it differs from the package name (e.g. sitemap-xml for package rb_sitemap_xml)"
  default: "{{ package_name | regex_replace('^rb_', '') | replace('_', '-') }}"
  validator: >-
    {% if not (cli_name | regex_search('^[a-z][a-z0-9_-]*$')) %}
    cli_name must be lowercase letters, digits, '-' or '_'
    {% endif %}

dist_name:
  type: str
  help: "Distribution name ([project] name; what `uv tool install` and dependencies use). Standard §10: rb-<slug> for import package rb_<slug>"
  default: "rb-{{ package_name | regex_replace('^rb_', '') | replace('_', '-') }}"
  validator: >-
    {% if not (dist_name | regex_search('^[a-z][a-z0-9._-]*$')) %}
    dist_name must be lowercase letters, digits, '.', '-' or '_'
    {% endif %}

dist_name_legacy:
  type: str
  help: "Previous distribution name while renaming to dist_name (standard §10) — installs made under it keep reporting their version; blank when not renaming"
  default: ""

project_name:
  type: str
  help: "Display name for the project"
  default: "{{ package_name }}"

description:
  type: str
  help: "One-sentence description of what this CLI does"
  default: "Project-aware automation CLI"

author_name:
  type: str
  help: "Author name for pyproject.toml"
  default: "Unknown"

include_auth:
  type: bool
  help: "Include the credentials/auth module (keyring-backed)?"
  default: true

include_providers:
  type: bool
  help: "Include providers/ (HttpProvider base for external APIs)? Only a CLI without credentials can do without it"
  default: true
  when: "{{ not include_auth }}"
  validator: >-
    {% if include_auth and not include_providers %}
    include_auth needs include_providers (auth status checks providers)
    {% endif %}

include_http_provider:
  type: bool
  help: "Include providers/http.py (HttpProvider: shared httpx client, retries, error mapping, the 10 s health probe)? No if no provider speaks HTTP"
  default: true
  when: "{{ include_providers }}"

include_ci:
  type: bool
  help: "Generate the GitHub Actions workflow? CI is optional (standard §6) — the local gate release.py --check is the check"
  default: true

private_deps:
  type: bool
  help: "Does it depend on our private git repos? CI then needs a GITHUB_READ_TOKEN repo secret (standard §9)"
  default: false
  when: "{{ include_ci }}"

repository_url:
  type: str
  help: "GitHub repo URL this package will live at (e.g. https://github.com/you/mycli; the skill creates it as a private repo after generation) — fills the `uv tool install git+…` command in README.md/SKILL.md; leave blank for a placeholder"
  default: ""
