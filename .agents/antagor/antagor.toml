schema = 1
mode = "fast"
prefix = "CG"
name = "cli-generator"
worker = "pi"  # `claude` is not installed on this machine: the default claude-code timed out at agent start (2026-11-08)
# The plugin manifest check, without the claude binary this machine lost on 2026-11-08 (CG-083, E-011).
checks = ["sh scripts/check_template.sh", "python3 scripts/check_plugin.py"]
# The template gate renders several packages; with the machine queue a worker's run can be silent > 10 min.
stall_minutes = 25
# Reminders while something waits for a decision (Antagor's default is 3).
notify_remind_min = 3
# The template gate (~5 min): a worker's green run of it is remembered, not run again after submit.
heavy = ["sh scripts/check_template.sh"]

# the workserver, 48 cores (the Human 28.10: at least four tasks at once); heavy checks queue on the machine
parallel = 4

[docs]
# The Standard and the skill's references ship inside the plugin: product data, not project docs
data = ["skills/cli-builder/reference/*.md"]
# The boundary contract with sysadmin is a living doc (docs/contracts/sysadmin.md)
living = ["docs/contracts/sysadmin.md"]

[limits]
# Mode fast: template tasks move or drop whole parts (E-006 CG-047).
max_files = 150
max_lines = 4000

[review]
worker = "pi-glm"  # another model than the author (the Human, 6.11)
required_types = ["feature", "bugfix"]  # chore and docs: the short path without review

[publish]
# The gate before the tag: the template gate on this machine (the Human 29.10: Gitea only stores releases, no remote
# test runs)
gate = "local"
gate_command = "sh scripts/check_template.sh"
tag_prefix = "v"
versioning = "semver"
changelog = "CHANGELOG.md"
deploy_command = "sh scripts/deploy.sh"

[daemon]
enabled = true

[workers.pi-glm]  # the reviewer: kind pi, model from [model_policy.pi-glm]
kind = "pi"
args = []

[architect.order]
pi = ["deepseek-4.1-flash", "deepseek-v4.1-flash"]  # matched inside the declared name (`9router/...`, `ocg/...`)
